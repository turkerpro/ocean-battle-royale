<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ocean Battle Royale</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#000;font-family:Arial,sans-serif}
canvas{display:block}
#ui{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
#menu{text-align:center;padding-top:20vh;color:#fff;text-shadow:0 0 20px rgba(0,150,255,.8)}
#menu h1{font-size:48px;margin-bottom:10px}
#menu p{color:#8cf;font-size:18px;margin-bottom:30px}
#menu button{pointer-events:all;padding:15px 50px;font-size:22px;border:none;border-radius:8px;cursor:pointer;margin:5px;font-weight:bold;transition:transform .1s}
#playBtn{background:#1a6;color:#fff}#playBtn:hover{background:#2b7;transform:scale(1.05)}
#fsBtn{background:#338;color:#fff}#fsBtn:hover{background:#44a;transform:scale(1.05)}
#hud{display:none}
.hud-el{position:absolute;font-size:16px;font-weight:bold;text-shadow:0 0 5px #000}
#hp{position:absolute;bottom:20px;left:20px;color:#0f0}
#xp{position:absolute;bottom:40px;left:20px;color:#ff0}
#level{position:absolute;bottom:60px;left:20px;color:#0ff;font-size:20px}
#info{position:absolute;top:10px;left:20px;color:rgba(255,255,255,.6);font-size:13px;font-weight:normal}
#kills{position:absolute;top:10px;right:20px;color:#f44}
#alive{position:absolute;top:30px;right:20px;color:#aaa}
#weapon{position:absolute;bottom:20px;right:20px;color:#fff}
#msg{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);color:#fff;font-size:40px;font-weight:bold;text-shadow:0 0 15px #f00;display:none;text-align:center;white-space:pre-line}
#minimap{position:absolute;bottom:20px;right:20px;width:160px;height:160px;border:2px solid rgba(255,255,255,.3);border-radius:5px;overflow:hidden}
#minimap canvas{width:100%;height:100%}
</style>
</head>
<body>
<div id="ui">
  <div id="menu">
    <h1>OCEAN BATTLE ROYALE</h1>
    <p>30 bot ile savas | Gelistirme sistemi | Mayin & Ates</p>
    <button id="playBtn">OYNA</button><br>
    <button id="fsBtn">TAM EKRAN</button>
  </div>
  <div id="hud">
    <div id="hp">HP: 80/80</div>
    <div id="xp">XP: 0/100</div>
    <div id="level">SEVIYE 1</div>
    <div id="info">WASD: Hareket | Fare: Nisangah | TIK: Ates | SPACE: Mayin | 1-3: Gemi Sec</div>
    <div id="kills">Kills: 0</div>
    <div id="alive">Alive: 31</div>
    <div id="weapon">[1] TICAIK</div>
    <div id="msg"></div>
    <div id="minimap"><canvas id="minimapCanvas" width="160" height="160"></canvas></div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script id="water-vs" type="x-shader/x-vertex">
uniform float uTime;
varying float vElevation;
varying vec3 vWorldPos;

void main(){
  vec3 pos = position;
  float w1 = sin(pos.x*0.03 + uTime*0.8)*2.5;
  float w2 = cos(pos.y*0.04 + uTime*0.6)*1.8;
  float w3 = sin((pos.x+pos.y)*0.02 + uTime*1.1)*1.2;
  float foam = sin(pos.x*0.15+uTime*2.0)*cos(pos.y*0.12+uTime*1.7)*0.3;
  pos.z = w1+w2+w3+foam;
  vElevation = pos.z;
  vWorldPos = (modelMatrix * vec4(pos,1.0)).xyz;
  gl_Position = projectionMatrix * modelViewMatrix * vec4(pos,1.0);
}
</script>
<script id="water-fs" type="x-shader/x-fragment">
uniform float uTime;
varying float vElevation;
varying vec3 vWorldPos;

void main(){
  vec3 deep    = vec3(0.01, 0.06, 0.18);
  vec3 mid     = vec3(0.02, 0.15, 0.35);
  vec3 shallow = vec3(0.05, 0.30, 0.50);
  vec3 foam    = vec3(0.70, 0.85, 0.95);

  float h = clamp((vElevation + 3.0) / 6.0, 0.0, 1.0);
  vec3 col = mix(deep, mid, smoothstep(0.0, 0.4, h));
  col = mix(col, shallow, smoothstep(0.4, 0.75, h));
  col = mix(col, foam, smoothstep(0.85, 1.0, h));

  float dist = length(vWorldPos.xz) * 0.001;
  col = mix(col, deep, smoothstep(0.3, 0.8, dist));

  float shimmer = sin(vWorldPos.x*0.5+uTime*2.0)*sin(vWorldPos.z*0.4+uTime*1.5)*0.06+0.94;
  col *= shimmer;

  gl_FragColor = vec4(col, 0.92);
}
</script>
<script>
const CFG = {
  worldSize: 600,
  botCount: 30,
  shipTypes: [
    {name:'Ticaik', hp:80, speed:14, size:.8, color:0x44aa44, fireRate:1.2, bulletSpeed:40, damage:8, range:60, bulletSize:.3},
    {name:'Firkateyn', hp:150, speed:12, size:1.1, color:0x4488cc, fireRate:0.8, bulletSpeed:50, damage:14, range:80, bulletSize:.4},
    {name:'Muhibe', hp:250, speed:10, size:1.4, color:0xcc8844, fireRate:0.5, bulletSpeed:55, damage:22, range:100, bulletSize:.5},
  ]
};

let scene, camera, renderer, clock;
let player, bots=[], bullets=[], mines=[], particles=[];
let keys={}, mouse={x:0,y:0,down:false}, gameStarted=false, gameOver=false;
let kills=0, level=1, xp=0, xpNeeded=100, weaponIdx=0;
let fireCooldown=0, mineCooldown=0;
let waterMesh;

const $ = id => document.getElementById(id);
const hpEl=$('hp'), xpEl=$('xp'), levelEl=$('level'), killsEl=$('kills'),
      aliveEl=$('alive'), weaponEl=$('weapon'), msgEl=$('msg'),
      hudEl=$('hud'), menuEl=$('menu');
const mmCanvas=$('minimapCanvas'), mmCtx=mmCanvas.getContext('2d');

$('playBtn').onclick=()=>{ startGame(); };
$('fsBtn').onclick=()=>{
  if(!document.fullscreenElement) document.documentElement.requestFullscreen();
  else document.exitFullscreen();
};

document.addEventListener('keydown',e=>keys[e.code]=true);
document.addEventListener('keyup',e=>keys[e.code]=false);
document.addEventListener('mousemove',e=>{
  mouse.x=(e.clientX/window.innerWidth)*2-1;
  mouse.y=-(e.clientY/window.innerHeight)*2+1;
});
document.addEventListener('mousedown',e=>{ if(e.button===0) mouse.down=true; });
document.addEventListener('mouseup',e=>{ if(e.button===0) mouse.down=false; });
document.addEventListener('contextmenu',e=>e.preventDefault());

// --- MATH HELPERS ---
const rand=Math.random, TAU=Math.PI*2;
function rm(a,b){return a+rand()*(b-a)}
function rc(a){return a[Math.floor(rand()*a.length)]}

// --- INIT ---
function init(){
  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x0a1628);
  scene.fog=new THREE.Fog(0x0a1628, 200, 600);

  camera=new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 2000);
  camera.position.set(0,60,-40);
  camera.lookAt(0,0,0);

  renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(window.innerWidth,window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);

  scene.add(new THREE.AmbientLight(0x223344,0.6));
  const sun=new THREE.DirectionalLight(0xffeedd,0.8);
  sun.position.set(100,150,50);
  sun.castShadow=true;
  sun.shadow.mapSize.set(2048,2048);
  const sh=sun.shadow.camera;
  sh.left=sh.bottom=-300; sh.right=sh.top=300;
  scene.add(sun);

  // Water (custom shader)
  const wGeo=new THREE.PlaneGeometry(CFG.worldSize*2,CFG.worldSize*2,200,200);
  const wMat=new THREE.ShaderMaterial({
    uniforms:{uTime:{value:0}},
    vertexShader:document.getElementById('water-vs').textContent,
    fragmentShader:document.getElementById('water-fs').textContent,
    transparent:true
  });
  waterMesh=new THREE.Mesh(wGeo,wMat);
  waterMesh.rotation.x=-Math.PI/2;
  waterMesh.position.y=-1;
  scene.add(waterMesh);

  clock=new THREE.Clock();
  window.addEventListener('resize',onResize);
  onResize();
  animate();
}
function onResize(){
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
}

// --- SHIP CREATION ---
function createShip(type,isPlayer){
  const s=CFG.shipTypes[type];
  const g=new THREE.Group();
  const sz=s.size;

  // Hull
  const hull=new THREE.Mesh(
    new THREE.BoxGeometry(2*sz,0.6*sz,5*sz),
    new THREE.MeshPhongMaterial({color:isPlayer?0x22aa44:s.color})
  );
  hull.position.y=0.3*sz;
  hull.castShadow=true;
  g.add(hull);

  // Deck
  const deck=new THREE.Mesh(
    new THREE.BoxGeometry(1.4*sz,0.3*sz,2.5*sz),
    new THREE.MeshPhongMaterial({color:isPlayer?0x33cc55:0x888866})
  );
  deck.position.set(0,0.75*sz,-0.3*sz);
  g.add(deck);

  // Tower
  const tower=new THREE.Mesh(
    new THREE.BoxGeometry(0.6*sz,0.8*sz,0.8*sz),
    new THREE.MeshPhongMaterial({color:0x666655})
  );
  tower.position.set(0,1.3*sz,0);
  g.add(tower);

  // Gun
  const gun=new THREE.Mesh(
    new THREE.CylinderGeometry(0.08*sz,0.08*sz,2*sz,8),
    new THREE.MeshPhongMaterial({color:0x333333})
  );
  gun.rotation.x=Math.PI/2;
  gun.position.set(0,1.1*sz,1.2*sz);
  g.add(gun);

  scene.add(g);
  return {
    mesh:g, type, hp:s.hp, maxHp:s.hp,
    speed:s.speed, fireRate:s.fireRate, bulletSpeed:s.bulletSpeed,
    damage:s.damage, range:s.range, bulletSize:s.bulletSize,
    isPlayer, alive:true, fireCD:0,
    aiTarget:null, aiNextDir:0
  };
}

// --- GAME START ---
function startGame(){
  menuEl.style.display='none';
  hudEl.style.display='block';
  gameStarted=true; gameOver=false;
  kills=0; level=1; xp=0; xpNeeded=100; weaponIdx=0;

  // Cleanup
  [bots,bullets,mines,particles].forEach(arr=>arr.forEach(o=>{if(o.mesh)scene.remove(o.mesh);}));
  bots=[]; bullets=[]; mines=[]; particles=[];

  // Player
  player=createShip(0,true);
  player.mesh.position.set(0,0,0);

  // Bots
  for(let i=0;i<CFG.botCount;i++){
    const t=Math.floor(rand()*3);
    const b=createShip(t,false);
    const a=rand()*TAU, r=rm(80,CFG.worldSize-80);
    b.mesh.position.set(Math.cos(a)*r,0,Math.sin(a)*r);
    bots.push(b);
  }
}

// --- COMBAT ---
function spawnBullet(shooter,target){
  const w=CFG.shipTypes[shooter.type];
  const dir=new THREE.Vector3().subVectors(target,shooter.mesh.position);
  dir.y=0;
  const dist=dir.length();
  if(dist<0.5)return;
  dir.normalize();
  if(dist>shooter.range)dir.multiplyScalar(shooter.range);
  const startPos=shooter.mesh.position.clone().add(dir.clone().multiplyScalar(3*CFG.shipTypes[shooter.type].size));
  startPos.y=1.1*CFG.shipTypes[shooter.type].size;

  const mesh=new THREE.Mesh(
    new THREE.SphereGeometry(w.bulletSize,6,6),
    new THREE.MeshBasicMaterial({color:shooter.isPlayer?0xffff00:0xff4400})
  );
  mesh.position.copy(startPos);
  scene.add(mesh);
  bullets.push({mesh,dir:dir.clone().normalize(),speed:w.bulletSpeed,damage:w.damage,
    range:w.range,traveled:0,owner:shooter});
}

function spawnMine(pos,owner){
  const mesh=new THREE.Mesh(
    new THREE.SphereGeometry(0.5,8,8),
    new THREE.MeshPhongMaterial({color:0xff2222,emissive:0x550000})
  );
  mesh.position.copy(pos);
  mesh.position.y=0.3;
  scene.add(mesh);
  mines.push({mesh,owner,timer:3,radius:8,damage:40});
}

function spawnExplosion(pos,color,count){
  for(let i=0;i<count;i++){
    const mesh=new THREE.Mesh(
      new THREE.SphereGeometry(rm(0.1,0.25),4,4),
      new THREE.MeshBasicMaterial({color})
    );
    mesh.position.copy(pos);
    scene.add(mesh);
    particles.push({mesh,vel:new THREE.Vector3(rm(-10,10),rm(5,15),rm(-10,10)),
      life:rm(0.3,0.8)});
  }
}

// --- PLAYER UPGRADE ---
function gainXP(amount){
  xp+=amount;
  while(xp>=xpNeeded){
    xp-=xpNeeded;
    level++;
    xpNeeded=level*120;
    player.maxHp=CFG.shipTypes[weaponIdx].hp;
    player.hp=player.maxHp;
    player.speed=CFG.shipTypes[weaponIdx].speed;
    player.fireRate=CFG.shipTypes[weaponIdx].fireRate;
    player.bulletSpeed=CFG.shipTypes[weaponIdx].bulletSpeed;
    player.damage=CFG.shipTypes[weaponIdx].damage;
    player.range=CFG.shipTypes[weaponIdx].range;
    player.bulletSize=CFG.shipTypes[weaponIdx].bulletSize;
    if(level===5&&weaponIdx<1){weaponIdx=1;showMsg("FIRKATEYN ACILDI!\n2'ye bas",2);}
    if(level===10&&weaponIdx<2){weaponIdx=2;showMsg("MUHIBE ACILDI!\n3'e bas",2);}
  }
}
function showMsg(text,dur){
  msgEl.textContent=text; msgEl.style.display='block';
  setTimeout(()=>msgEl.style.display='none',dur*1000);
}

// --- SHIP SCALE FIX ---
function setShipScale(ship){
  const s=CFG.shipTypes[ship.type].size;
  ship.mesh.scale.set(s*1.2,1,s*1.2);
}

// --- UPDATE LOOP ---
function update(dt){
  if(!gameStarted||gameOver)return;
  fireCooldown=Math.max(0,fireCooldown-dt);
  mineCooldown=Math.max(0,mineCooldown-dt);

  // Weapon switch (check level unlock)
  if(keys['Digit1'])weaponIdx=0;
  if(keys['Digit2']&&level>=5)weaponIdx=1;
  if(keys['Digit3']&&level>=10)weaponIdx=2;
  player.type=weaponIdx;

  // Player movement (A/D rotate, W/S thrust)
  const fwd=new THREE.Vector3(0,0,1).applyQuaternion(player.mesh.quaternion);
  if(keys['KeyW']||keys['ArrowUp'])player.mesh.position.addScaledVector(fwd,player.speed*dt);
  if(keys['KeyS']||keys['ArrowDown'])player.mesh.position.addScaledVector(fwd,-player.speed*0.5*dt);
  if(keys['KeyA']||keys['ArrowLeft'])player.mesh.rotateY(2.5*dt);
  if(keys['KeyD']||keys['ArrowRight'])player.mesh.rotateY(-2.5*dt);

  // Boundary
  const wp=player.mesh.position, bnd=CFG.worldSize-10;
  wp.x=Math.max(-bnd,Math.min(bnd,wp.x));
  wp.z=Math.max(-bnd,Math.min(bnd,wp.z));
  wp.y=0;

  // Fire (mouse position -> aim -> shoot)
  if(mouse.down&&fireCooldown<=0){
    const rc=new THREE.Raycaster();
    rc.setFromCamera(new THREE.Vector2(mouse.x,mouse.y),camera);
    const plane=new THREE.Plane(new THREE.Vector3(0,1,0),0);
    const target=new THREE.Vector3();
    rc.ray.intersectPlane(plane,target);
    if(target){spawnBullet(player,target);fireCooldown=player.fireRate;}
  }
  if(keys['Space']&&mineCooldown<=0){
    spawnMine(player.mesh.position.clone(),player);
    mineCooldown=2; keys['Space']=false;
  }

  // Flat list of alive ships
  const alive=[player,...bots].filter(b=>b.alive);
  aliveEl.textContent='Alive: '+alive.length;

  // --- BOT AI ---
  for(const bot of bots){
    if(!bot.alive)continue;
    bot.fireCD=Math.max(0,bot.fireCD-dt);

    // Pick target if needed
    if(!bot.aiTarget||bot.mesh.position.distanceTo(bot.aiTarget)<5||Date.now()>bot.aiNextDir){
      let nearest=null,nd=Infinity;
      for(const o of alive){
        if(o===bot)continue;
        const d=bot.mesh.position.distanceTo(o.mesh.position);
        if(d<nd){nd=d;nearest=o;}
      }
      if(nearest&&nd<100)bot.aiTarget=nearest.mesh.position.clone();
      else{
        const a=rand()*TAU,r=rm(50,CFG.worldSize*0.6);
        bot.aiTarget=new THREE.Vector3(Math.cos(a)*r,0,Math.sin(a)*r);
      }
      bot.aiNextDir=Date.now()+rm(2000,5000);
    }

    // Move toward target
    const toT=new THREE.Vector3().subVectors(bot.aiTarget,bot.mesh.position);
    toT.y=0;
    if(toT.length()>3){
      const targetAngle=Math.atan2(toT.x,toT.z);
      let dA=targetAngle-bot.mesh.rotation.y;
      while(dA>Math.PI)dA-=TAU;while(dA<-Math.PI)dA+=TAU;
      bot.mesh.rotateY(Math.sign(dA)*Math.min(Math.abs(dA),2.5*dt));
      const f=new THREE.Vector3(0,0,1).applyQuaternion(bot.mesh.quaternion);
      bot.mesh.position.addScaledVector(f,bot.speed*0.6*dt);
    }
    bot.mesh.position.y=0;
    const b={...bot}; // clamp bots
    bot.mesh.position.x=Math.max(-CFG.worldSize+10,Math.min(CFG.worldSize-10,bot.mesh.position.x));
    bot.mesh.position.z=Math.max(-CFG.worldSize+10,Math.min(CFG.worldSize-10,bot.mesh.position.z));

    // Bot fires at nearest in range
    if(bot.fireCD<=0){
      for(const o of alive){
        if(o===bot)continue;
        const d=bot.mesh.position.distanceTo(o.mesh.position);
        if(d<bot.range){spawnBullet(bot,o.mesh.position);bot.fireCD=bot.fireRate*rm(0.8,1.4);break;}
      }
    }
  }

  // --- BULLETS ---
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    b.mesh.position.addScaledVector(b.dir,b.speed*dt);
    b.traveled+=b.speed*dt;
    let hit=false;

    for(const ship of alive){
      if(ship===b.owner)continue;
      const d=b.mesh.position.distanceTo(ship.mesh.position);
      if(d<2.5*CFG.shipTypes[ship.type].size){
        ship.hp-=b.damage;
        spawnExplosion(b.mesh.position.clone(),0xffaa00,5);
        hit=true;
        if(ship.hp<=0){
          ship.alive=false;
          scene.remove(ship.mesh);
          spawnExplosion(ship.mesh.position.clone(),0xff4400,20);
          if(b.owner.isPlayer){kills++;gainXP(30+ship.type*20);}
          else if(ship===player){
            gameOver=true;
            showMsg("OLDUN!\nTikla - Yeniden Basla",99);
            document.addEventListener('click',()=>startGame(),{once:true});
          }
        }
        break;
      }
    }
    if(hit||b.traveled>b.range){scene.remove(b.mesh);bullets.splice(i,1);}
  }

  // --- MINES ---
  for(let i=mines.length-1;i>=0;i--){
    const m=mines[i];
    m.timer-=dt;
    m.mesh.rotation.y+=dt*2;
    if(m.timer<=0){
      for(const ship of alive){
        if(ship===m.owner)continue;
        if(m.mesh.position.distanceTo(ship.mesh.position)<m.radius){
          ship.hp-=m.damage;
          spawnExplosion(m.mesh.position.clone(),0xff2200,15);
          if(ship.hp<=0){ship.alive=false;scene.remove(ship.mesh);
            spawnExplosion(ship.mesh.position.clone(),0xff4400,20);
            if(m.owner.isPlayer){kills++;gainXP(40);}}
        }
      }
      scene.remove(m.mesh);mines.splice(i,1);
    }
  }

  // --- PARTICLES ---
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.mesh.position.addScaledVector(p.vel,dt);
    p.vel.y-=25*dt;
    p.life-=dt;
    if(p.life<=0){scene.remove(p.mesh);particles.splice(i,1);}
  }

  // Water shader time
  waterMesh.material.uniforms.uTime.value=Date.now()*0.001;

  // Camera follows player
  if(player.alive){
    const camT=player.mesh.position.clone().add(new THREE.Vector3(0,45,-30));
    camera.position.lerp(camT,5*dt);
    const lkT=player.mesh.position.clone();lkT.y=0;
    camera.lookAt(lkT);
  }

  // HUD
  hpEl.textContent=`HP: ${Math.ceil(Math.max(0,player.hp))}/${player.maxHp}`;
  hpEl.style.color=player.hp/player.maxHp>0.5?'#0f0':player.hp/player.maxHp>0.25?'#ff0':'#f00';
  xpEl.textContent=`XP: ${xp}/${xpNeeded}`;
  levelEl.textContent=`SEVIYE ${level}`;
  killsEl.textContent=`Kills: ${kills}`;
  weaponEl.textContent=`[${weaponIdx+1}] ${CFG.shipTypes[weaponIdx].name.toUpperCase()}`;

  // Minimap
  mmCtx.fillStyle='rgba(0,20,50,0.9)';
  mmCtx.fillRect(0,0,160,160);
  const sc=160/(CFG.worldSize*2.2);
  const px=80+player.mesh.position.x*sc, py=80+player.mesh.position.z*sc;
  for(const b of bots){
    if(!b.alive)continue;
    mmCtx.fillStyle=b.isPlayer?'#0f0':'#f44';
    mmCtx.beginPath();
    mmCtx.arc(80+b.mesh.position.x*sc,80+b.mesh.position.z*sc,b.isPlayer?3:2,0,TAU);
    mmCtx.fill();
  }
  mmCtx.fillStyle='#0f0';
  mmCtx.beginPath();mmCtx.arc(px,py,3,0,TAU);mmCtx.fill();
}

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05);
  update(dt);
  renderer.render(scene,camera);
}
init();
</script>
</body>
</html>
