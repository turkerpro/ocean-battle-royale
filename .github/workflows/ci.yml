name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  UNITY_VERSION: 6000.0.32f1
  UNITY_IMAGE: unityci/editor:ubuntu-6000.0.32f1-webgl-3

jobs:
  build-webgl:
    name: Build WebGL
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          docker image prune -af
          df -h

      - name: Pull Unity Docker image
        run: docker pull ${{ env.UNITY_IMAGE }}

      - name: Activate & Build WebGL
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/github/workspace \
            -w /github/workspace \
            -e UNITY_EMAIL="${{ secrets.UNITY_EMAIL }}" \
            -e UNITY_PASSWORD="${{ secrets.UNITY_PASSWORD }}" \
            ${{ env.UNITY_IMAGE }} \
            /bin/bash -c '
              echo "=== Unity Version ==="
              /opt/unity/Editor/Unity -version || true

              echo "=== Activating license ==="
              xvfb-run --auto-servernum --server-args="-screen 0 640x480x24" \
                /opt/unity/Editor/Unity \
                -batchmode \
                -nographics \
                -quit \
                -logFile /dev/stdout \
                -username "$UNITY_EMAIL" \
                -password "$UNITY_PASSWORD" \
                || echo "Activation step completed (may have warnings)"

              echo "=== Building WebGL ==="
              xvfb-run --auto-servernum --server-args="-screen 0 640x480x24" \
                /opt/unity/Editor/Unity \
                -batchmode \
                -nographics \
                -quit \
                -logFile /dev/stdout \
                -username "$UNITY_EMAIL" \
                -password "$UNITY_PASSWORD" \
                -projectPath /github/workspace \
                -buildTarget WebGL \
                -executeMethod OceanBattleRoyale.Editor.BuildScript.BuildWebGL \
                || true

              echo "=== Build output ==="
              ls -la build/WebGL/ 2>/dev/null || echo "No build output found"
            '
      - name: Upload WebGL Build
        uses: actions/upload-artifact@v4
        with:
          name: webgl-build
          path: build/WebGL
          retention-days: 14

  deploy-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build-webgl
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download WebGL Build
        uses: actions/download-artifact@v4
        with:
          name: webgl-build
          path: webgl

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: webgl

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
