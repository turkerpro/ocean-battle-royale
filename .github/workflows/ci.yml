name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  UNITY_VERSION: 6000.0.32f1

jobs:
  build-webgl:
    name: Build WebGL + Deploy to GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Unity
        uses: game-ci/unity-installer@v2
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          cacheKey: unity-${{ env.UNITY_VERSION }}-${{ hashFiles('Packages/manifest.json') }}

      - name: Build WebGL
        uses: game-ci/unity-builder@v2
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: .
          targetPlatform: WebGL
          allowDirtyBuild: true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/WebGL/WebGL

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Unity
        uses: game-ci/unity-installer@v2
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          cacheKey: unity-${{ env.UNITY_VERSION }}-${{ hashFiles('Packages/manifest.json') }}

      - name: Build Android
        uses: game-ci/unity-builder@v2
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: .
          targetPlatform: Android
          allowDirtyBuild: true

      - name: Upload Android Build
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: build/Android

  build-windows:
    name: Build Windows
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Unity
        uses: game-ci/unity-installer@v2
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          cacheKey: unity-${{ env.UNITY_VERSION }}-${{ hashFiles('Packages/manifest.json') }}

      - name: Build Windows
        uses: game-ci/unity-builder@v2
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: .
          targetPlatform: StandaloneWindows64
          allowDirtyBuild: true

      - name: Upload Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: build/StandaloneWindows64
