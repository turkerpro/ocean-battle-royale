name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  UNITY_VERSION: 2022.3.20f1
  UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Unity
        uses: game-ci/unity-installer@v2
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          cacheKey: unity-${{ env.UNITY_VERSION }}-${{ hashFiles('Packages/manifest.json') }}

      - name: Run Unit Tests
        uses: game-ci/unity-test-runner@v2
        env:
          UNITY_LICENSE: ${{ env.UNITY_LICENSE }}
        with:
          projectPath: .
          testMode: editmode
          artifactsPath: artifacts/editmode

      - name: Run Integration Tests
        uses: game-ci/unity-test-runner@v2
        env:
          UNITY_LICENSE: ${{ env.UNITY_LICENSE }}
        with:
          projectPath: .
          testMode: playmode
          artifactsPath: artifacts/playmode

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: artifacts

  build-android:
    name: Build Android (AAB)
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 60
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Unity
        uses: game-ci/unity-installer@v2
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          cacheKey: unity-${{ env.UNITY_VERSION }}-${{ hashFiles('Packages/manifest.json') }}

      - name: Build Android App Bundle
        uses: game-ci/unity-builder@v2
        env:
          UNITY_LICENSE: ${{ env.UNITY_LICENSE }}
        with:
          projectPath: .
          targetPlatform: Android
          buildMethod: BuildScript.BuildAndroid
          customParameters: -outputPath build/OceanBattleRoyale.aab

      - name: Upload Android Build
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: build/OceanBattleRoyale.aab

  build-webgl:
    name: Build WebGL
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 60
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Unity
        uses: game-ci/unity-installer@v2
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          cacheKey: unity-${{ env.UNITY_VERSION }}-${{ hashFiles('Packages/manifest.json') }}

      - name: Build WebGL
        uses: game-ci/unity-builder@v2
        env:
          UNITY_LICENSE: ${{ env.UNITY_LICENSE }}
        with:
          projectPath: .
          targetPlatform: WebGL
          buildMethod: BuildScript.BuildWebGL
          customParameters: -outputPath build/WebGL

      - name: Upload WebGL Build
        uses: actions/upload-artifact@v4
        with:
          name: webgl-build
          path: build/WebGL

  build-windows:
    name: Build Windows (Standalone)
    runs-on: windows-latest
    needs: test
    timeout-minutes: 60
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Unity
        uses: game-ci/unity-installer@v2
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          cacheKey: unity-${{ env.UNITY_VERSION }}-${{ hashFiles('Packages/manifest.json') }}

      - name: Build Windows
        uses: game-ci/unity-builder@v2
        env:
          UNITY_LICENSE: ${{ env.UNITY_LICENSE }}
        with:
          projectPath: .
          targetPlatform: StandaloneWindows64
          buildMethod: BuildScript.BuildWindows
          customParameters: -outputPath build/Windows/OceanBattleRoyale.exe

      - name: Upload Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: build/Windows
